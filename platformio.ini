[platformio]
src_dir = .
include_dir = Core/Inc
boards_dir = boards
default_envs = release

[env]
platform = ststm32
platform_packages =
    toolchain-gccarmnoneeabi@=1.140201.0
monitor_speed = 115200

board = genericSTM32G473CC
board_build.ldscript = STM32G473XX_FLASH.ld

;   mode=Normal : hotplug connect (no NRST needed).
;   mode=UR     : connect under reset (needs NRST wired) - use this if a
;                 Normal connect fails or to recover a misbehaving target.
upload_protocol = custom
upload_command = STM32_Programmer_CLI -c port=SWD mode=Normal -d "$BUILD_DIR/firmware.elf" -v -rst
debug_tool = stlink

build_src_filter =
    +<Core/Src/>
    +<Drivers/STM32G4xx_HAL_Driver/Src/>
    -<Drivers/STM32G4xx_HAL_Driver/Src/*_template.c>
    +<startup_stm32g473xx.s>

build_flags =
    -std=gnu23
    -DUSE_HAL_DRIVER
    -DSTM32G473xx
    -ICore/Inc
    -ICore/Inc/serializer
    -IDrivers/CMSIS/Include
    -IDrivers/STM32G4xx_HAL_Driver/Inc
    -IDrivers/STM32G4xx_HAL_Driver/Inc/Legacy
    -IDrivers/CMSIS/Device/ST/STM32G4xx/Include

check_tool = clangtidy
check_flags =
    clangtidy: --checks=-*,cert-*,clang-analyzer-*,bugprone-*,performance-*,readability-*,-bugprone-easily-swappable-parameters
    clangtidy: --warnings-as-errors=clang-analyzer-*,bugprone-*
    clangtidy: --header-filter=^.*Core/(Inc|Src)/serializer/[^/]+\.(c|h)$
    clangtidy: --system-headers=false
    clangtidy: --extra-arg=-std=gnu23
check_src_filters =
    -<**>
    +<Core/Src/serializer>
    +<Core/Inc/serializer>

[env:release]

[env:debug]
build_type = debug
